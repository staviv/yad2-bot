name: Yad2 Stealth Scanner to Google Apps Script

on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'

jobs:
  scan-yad2:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOAKBROWSER_LICENSE_KEY: ${{ secrets.CLOAKBROWSER_LICENSE_KEY }}

    steps:
      - name: ⏱️ Random Jitter (Up to 180s when triggered by Cron)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$(( RANDOM % 180 ))
          echo "Sleeping for ${DELAY}s to randomize timing..."
          sleep $DELAY

      - name: 📦 Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: 🕵️ Cache CloakBrowser Binary & Persistent Profile
        uses: actions/cache@v5
        with:
          path: |
            ~/.cloakbrowser
            ~/.npm
            ./yad2-profile
          key: cloakbrowser-yad2-v3-${{ runner.os }}
          restore-keys: |
            cloakbrowser-yad2-v3-
            cloakbrowser-yad2-v2-
            cloakbrowser-yad2-v1-

      - name: 🌐 Install CloakBrowser (C++ Patched Stealth Chromium) & Xvfb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOAKBROWSER_LICENSE_KEY: ${{ secrets.CLOAKBROWSER_LICENSE_KEY }}
        run: |
          # ניקוי רפוזיטורי צד-שלישי ב-Runner כדי ש-apt-get update לא ייכשל בגלל תקלות זמניות בשרתי מיקרוסופט/אובונטו
          sudo rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources || true
          sudo apt-get update -o Acquire::Retries=3 || true
          sudo apt-get install -y --no-install-recommends xvfb xauth libgbm1 libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2 libasound2t64 fonts-noto-core || sudo apt-get install -y xvfb

          npm init -y
          npm install --prefer-offline --no-audit --no-fund cloakbrowser playwright-core

          # אם בינארי הדפדפן כבר קיים מה-Cache, אין צורך להוריד 535MB מחדש (מונע חסימת Rate Limit של GitHub Releases)
          if [ -d "$HOME/.cloakbrowser" ] && [ -n "$(find "$HOME/.cloakbrowser" -type f -executable 2>/dev/null)" ]; then
            echo "✅ CloakBrowser binary already restored from cache! Skipping download."
          else
            echo "⬇️ Downloading CloakBrowser binary..."
            npx cloakbrowser install || { sleep 5 && npx cloakbrowser install; }
          fi

      - name: 🔍 Scrape Yad2 with CloakBrowser & Push to Google Apps Script
        env:
          GAS_WEB_APP_URL: ${{ secrets.GAS_WEB_APP_URL || 'https://script.google.com/macros/s/AKfycby2MJGz3Bq8fJJUtL8r0gWuJGa9I9H-1AaannsZuDyakbSIdq38wYpZrXIrRheMdshUgw/exec' }}
          PROXY_URL: ${{ secrets.PROXY_URL || '' }}
          CLOAKBROWSER_LICENSE_KEY: ${{ secrets.CLOAKBROWSER_LICENSE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > scan_yad2.mjs
          import { launchPersistentContext } from 'cloakbrowser';

          const gasUrl = process.env.GAS_WEB_APP_URL;
          const proxyUrl = (process.env.PROXY_URL || '').trim();

          if (!gasUrl) {
            throw new Error('Missing GAS_WEB_APP_URL environment variable');
          }

          async function extractFromPageWithRetries(page, searchItem) {
            for (let attempt = 1; attempt <= 2; attempt++) {
              await page.goto(searchItem.url, { waitUntil: 'domcontentloaded', timeout: 45000 });

              // Poll up to 25 seconds for __NEXT_DATA__ or feed links (checks immediately first before sleeping)
              for (let sec = 0; sec < 25; sec++) {
                const state = await page.evaluate(() => {
                  const el = document.getElementById('__NEXT_DATA__');
                  if (el && el.textContent) {
                    return { type: 'next_data', content: el.textContent, title: document.title };
                  }
                  const itemLinks = document.querySelectorAll('a[href*="/realestate/item/"]');
                  if (itemLinks.length > 0) {
                    return { type: 'html', content: document.documentElement.outerHTML, title: document.title };
                  }
                  return { type: 'waiting', title: document.title, bodyPreview: (document.body?.innerText || '').slice(0, 200) };
                });

                if (state.type === 'next_data') {
                  return {
                    name: searchItem.name,
                    url: searchItem.url,
                    minPrice: searchItem.minPrice || null,
                    maxPrice: searchItem.maxPrice || null,
                    nextData: JSON.parse(state.content)
                  };
                }
                if (state.type === 'html') {
                  return {
                    name: searchItem.name,
                    url: searchItem.url,
                    minPrice: searchItem.minPrice || null,
                    maxPrice: searchItem.maxPrice || null,
                    html: state.content
                  };
                }

                if (sec === 0) {
                  try {
                    await page.mouse.move(300 + Math.floor(Math.random() * 400), 250 + Math.floor(Math.random() * 300));
                    await page.mouse.wheel(0, 300);
                  } catch (e) {}
                }
                await page.waitForTimeout(1000);
              }

              const diagTitle = await page.title();
              console.warn(`Attempt ${attempt} did not find __NEXT_DATA__. Page title: "${diagTitle}"`);
            }

            const finalTitle = await page.title();
            const finalHtml = await page.content();
            const isShieldSquare = finalHtml.includes('ShieldSquare') || finalHtml.includes('validate.perfdrive.com') || finalHtml.includes('stormcaster');
            return {
              name: searchItem.name,
              url: searchItem.url,
              minPrice: searchItem.minPrice || null,
              maxPrice: searchItem.maxPrice || null,
              error: isShieldSquare
                ? `Yad2 ShieldSquare blocked GitHub Azure IP (Page title: ${finalTitle})`
                : `No __NEXT_DATA__ found (Page title: ${finalTitle})`
            };
          }

          async function main() {
            console.log('1. Fetching active search URLs from Google Sheets via Apps Script...');
            const searchesRes = await fetch(`${gasUrl}?action=searches`, { redirect: 'follow' });
            const searchesData = await searchesRes.json();

            const searches = Array.isArray(searchesData.searches) ? searchesData.searches : [];
            console.log(`Found ${searches.length} active search URLs in Google Sheets.`);
            if (searches.length === 0) {
              console.log('No active searches to scan. Exiting.');
              return;
            }

            console.log('2. Launching CloakBrowser (C++ Stealth Chromium) inside Xvfb...');
            const launchOpts = {
              userDataDir: './yad2-profile',
              headless: false,
              humanize: true,
              locale: 'he-IL',
              timezone: 'Asia/Jerusalem',
              viewport: { width: 1366, height: 768 },
              args: [
                '--fingerprint=58492',
                '--fingerprint-platform=windows',
                '--fingerprint-screen-width=1366',
                '--fingerprint-screen-height=768',
                '--fingerprint-storage-quota=5000'
              ]
            };
            if (proxyUrl) {
              launchOpts.proxy = proxyUrl;
              launchOpts.geoip = true;
            }

            const context = await launchPersistentContext(launchOpts);

            // Pre-seed Yad2 ShieldSquare cookies into the persistent profile
            await context.addCookies([
              { name: '__ssds', value: '0', domain: '.yad2.co.il', path: '/' },
              { name: '__ssuzjsr0', value: 'a9be0cd8e', domain: '.yad2.co.il', path: '/' },
              { name: '__uzmaj0', value: '955190e7-4dc9-4ebb-8ae3-73a33a1f0dcf', domain: '.yad2.co.il', path: '/' },
              { name: '__uzmbj0', value: '1793181117', domain: '.yad2.co.il', path: '/' },
              { name: '__uzmcj0', value: '638991073980', domain: '.yad2.co.il', path: '/' },
              { name: '__uzmdj0', value: '1793181117', domain: '.yad2.co.il', path: '/' }
            ]);

            const page = await context.newPage();
            const pagesPayload = [];

            // Quick warm-up on homepage
            try {
              console.log('Warm-up visit to yad2.co.il...');
              await page.goto('https://www.yad2.co.il/', { waitUntil: 'domcontentloaded', timeout: 20000 });
              await page.waitForTimeout(800);
            } catch (e) {
              console.warn('Warm-up note:', e.message);
            }

            for (let i = 0; i < searches.length; i++) {
              const s = searches[i];
              console.log(`Scanning [${i + 1}/${searches.length}]: ${s.name} -> ${s.url}`);
              try {
                const resItem = await extractFromPageWithRetries(page, s);
                pagesPayload.push(resItem);
                if (resItem.nextData || resItem.html) {
                  console.log(`✅ Extracted data for "${s.name}".`);
                } else {
                  console.warn(`⚠️ Failed for "${s.name}": ${resItem.error}`);
                }
              } catch (err) {
                console.error(`Error scanning "${s.name}":`, err.message);
                pagesPayload.push({
                  name: s.name,
                  url: s.url,
                  minPrice: s.minPrice || null,
                  maxPrice: s.maxPrice || null,
                  error: err.message
                });
              }
            }

            await context.close();

            console.log('3. Sending extracted Yad2 data to Google Apps Script (Sheets + Telegram)...');
            const postRes = await fetch(gasUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                type: 'yad2_ingest',
                pages: pagesPayload
              }),
              redirect: 'follow'
            });

            const postText = await postRes.text();
            console.log('Google Apps Script Response:', postText);
          }

          main().catch((err) => {
            console.error('Fatal error:', err);
            process.exit(1);
          });
          EOF

          xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" node scan_yad2.mjs

